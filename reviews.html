<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kind Words | Flavour Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"></head><body><main id="pg"><div class="wrap ph"><h1>Kind <span class="grad">words</span></h1><p class="lead">Ate with us? Tell everyone how it was. You can leave a review any time, as often as you like.</p>
 <div id="kb"></div>
 <div class="rgrid"><div>
  <div class="panel sumcard"><div style="text-align:center"><div class="big" id="avg">–</div><div class="stars" id="astars" style="font-size:1.4rem"></div><small class="mut" id="cnt"></small></div><div class="bars" id="bars"></div></div>
  <div class="filters" id="rf2" style="margin:1.5rem 0 1rem" role="group" aria-label="Filter reviews"></div><div id="list"></div></div>
  <div class="panel" id="write" style="position:sticky;top:90px"><h2>Write a review</h2><form id="rv" novalidate style="margin-top:1rem">
   <div><b>Your rating</b><div class="sp" id="sp2"></div></div>
   <div class="fr"><label>About<select name="kind"><option>Overall</option><option>Food</option><option>Service</option><option>Ambience</option><option>Delivery</option></select></label><label>Dish<select name="dish" id="dsel"><option value="site">Overall experience</option></select></label></div>
   <label>Your name<input name="name" autocomplete="name" required></label>
   <label>Your review<textarea name="comment" placeholder="What did you love? What could be better?" required></textarea></label>
   <details id="vd"><summary>✔ Get a "Verified" badge (optional)</summary><p>Enter the reference and email from your order or booking.</p><div class="fr"><input name="ref" placeholder="ORD-XXXXX or FL-XXXXX"><input name="email" type="email" placeholder="Email used"></div></details>
   <button class="btn" type="submit">Post review</button><p class="status" role="status"></p></form></div></div></div></main><script src="site.js"></script><script>
const KP=new URLSearchParams(location.search).get("kind")||"all";let all=null,filt=KP==="Verified"?"ver":KP,voted=[];try{voted=JSON.parse(localStorage.getItem("hv")||"[]")}catch{}
const fmt=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const col=n=>"hsl("+([...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360)+",65%,45%)";
async function load(){all=await(await fetch("/api/reviews/all")).json();draw()}
const KI={Food:["🍽️","Food reviews","What guests say about our dishes.","#ff6b35","#ff2e7e"],Service:["🤝","Service reviews","How our team looks after you.","#2f8bff","#22d3ee"],Ambience:["✨","Ambience reviews","The look, feel and atmosphere.","#8b5cf6","#ff6a88"],Delivery:["🚚","Delivery reviews","Speed, packaging and condition on arrival.","#14d9b5","#2f8bff"],ver:["✔","Verified reviews","From guests with a confirmed order or booking.","#22c55e","#14d9b5"]};
function draw(){const a=all;
 const K=KI[filt];if(K){const L=a.list.filter(r=>filt==="ver"?r.verified:r.kind===filt),av=L.length?(L.reduce((s,r)=>s+r.rating,0)/L.length).toFixed(1):"–";
  $("#kb").innerHTML=`<div class="kb" style="--a:${K[3]};--b:${K[4]}"><em>${K[0]}</em><div><h2>${K[1]}</h2><p>${K[2]}</p></div><div style="margin-left:auto;text-align:right"><b style="font:800 2.2rem var(--h)">${av}</b> ★<br>${L.length} review${L.length==1?"":"s"}</div></div>`;document.title=K[1]+" | Flavour Lab"}else $("#kb").innerHTML="";$("#avg").textContent=a.count?a.avg.toFixed(1):"–";const r=Math.round(a.avg);
 $("#astars").textContent=a.count?"★".repeat(r)+"☆".repeat(5-r):"";$("#cnt").textContent=a.count+" review"+(a.count==1?"":"s");
 $("#bars").innerHTML=[5,4,3,2,1].map(n=>{const c=a.dist[n-1],p=a.count?Math.round(c/a.count*100):0;return `<div><span>${n}★</span><div class="bar2"><i style="width:${p}%"></i></div><span>${c}</span></div>`}).join("");
 const F=[["all","All"],["5","5★"],["4","4★"],["3","3★"],["2","2★"],["1","1★"],["Food","Food"],["Service","Service"],["Delivery","Delivery"],["Ambience","Ambience"],["ver","✔ Verified"]];
 $("#rf2").innerHTML=F.map(([k,t])=>`<button aria-pressed="${k===filt}" data-f="${k}">${t}</button>`).join("");
 const l=a.list.filter(r=>filt==="all"||(filt==="ver"?r.verified:/^\d$/.test(filt)?r.rating==+filt:r.kind===filt));
 $("#list").innerHTML=l.length?l.map(r=>`<div class="rev"><div style="display:flex;gap:.8rem;align-items:center"><span class="av" style="background:${col(r.name)}">${esc((r.name[0]||"?").toUpperCase())}</span><div><b>${esc(r.name)}</b>${r.verified?' <span class="ver">✔ Verified</span>':""}<br><small class="mut">${fmt(r.at)} · ${esc(r.kind)} · ${esc(r.dishName)}</small></div><span class="stars" style="margin-left:auto">${"★".repeat(r.rating)}</span></div>
  <p style="margin:.7rem 0">${esc(r.comment)}</p><button class="helpful" data-id="${r.id}" ${voted.includes(r.id)?"disabled":""}>👍 Helpful (${r.helpful||0})</button></div>`).join(""):'<p class="lead">No reviews match yet. Be the first to write one!</p>'}
$("#rf2").onclick=e=>{const b=e.target.closest("button");if(b){filt=b.dataset.f;draw()}};
$("#list").onclick=async e=>{const b=e.target.closest(".helpful");if(!b||b.disabled)return;const id=b.dataset.id;
 try{await post("/api/reviews/"+id+"/helpful",{});voted.push(id);localStorage.setItem("hv",JSON.stringify(voted))}catch{}load()};
stars($("#sp2"),5);autofill("#rv");
const q=new URLSearchParams(location.search);if(q.get("ref")){const f=$("#rv");f.elements.ref.value=q.get("ref");f.elements.email.value=q.get("email")||ME.email||"";$("#vd").open=true}
getDishes().then(ds=>{$("#dsel").innerHTML+=ds.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")});
$("#rv").onsubmit=async e=>{e.preventDefault();const s=e.target.querySelector(".status");s.className="status";
 try{const r=await post("/api/reviews",Object.fromEntries(new FormData(e.target)));s.className="status ok";s.textContent=r.verified?"Thank you! Your verified review is live. ✔":"Thank you! Your review is live.";
  e.target.reset();stars($("#sp2"),5);toast("Review posted ⭐");load()}catch(x){s.className="status err";s.textContent=x.message}};
load();</script></body></html>
